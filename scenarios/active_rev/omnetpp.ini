[General]
# Switched from artery.inet.World -- adds environmentModel (GlobalEnvironmentModel) +
# idRegistry + jammerRegistry, needed by the mobile-jamming-bubble attack's position lookup.
# Confirmed behavior-neutral for the existing Chapter 4 baseline via Phase 0B's paired
# base/envmod comparison runs (deterministic streams identical; system-time-reseeded
# revocation-timing streams show run-to-run variance consistent with pre-existing same-
# network noise, no directional shift observed) -- re-run that comparison if this file's
# module topology changes again.
network = artery.envmod.World

sim-time-limit = 3600s
debug-on-errors = true
print-undisposed = true

cmdenv-express-mode = true
cmdenv-autoflush = true

**.scalar-recording = false
**.vector-recording = false

*.traci.core.version = -1
*.traci.launcher.typename = "PosixLauncher"
*.traci.launcher.sumocfg = "active_rev.sumocfg"
*.traci.launcher.sumo = "sumo-gui"

# separate random number generator for MaliciousCRLVehicleService's attacker-selection draw
# (A1), isolated from stream 0 so the attackerShare=0 regression check reproduces the
# existing baseline's stream-0 draw sequence unperturbed
num-rngs = 2
**.MaliciousCRLVehicleService.rng-0 = 1

# RSU Configuration
*.numRoadSideUnits = 1

*.rsu[*].typename = "RSU"
*.rsu[*].wlan[*].typename = "VanetNic"
*.rsu[*].wlan[*].radio.channelNumber = 180
*.rsu[*].wlan[*].radio.carrierFrequency = 5.9 GHz
*.rsu[*].wlan[*].radio.transmitter.power = 200 mW

*.rsu[*].middleware.datetime = "2013-06-01 12:35:00"
*.rsu[*].middleware.services = xmldoc("services-rsu.xml")

*.rsu[0].**.protectedCommunicationZones = xml("<zones><zone latitude=\"49.576070\" longitude=\"11.015889\" /></zones>")

*.rsu[0].mobility.initialZ = 20m
*.rsu[0].mobility.initialX = 50m
*.rsu[0].mobility.initialY = 50m

**.RevocationAuthorityService.revocationMode = "interval"
**.RevocationAuthorityService.crlGenInterval = 6s
**.RevocationAuthorityService.minRevocationInterval = 45s
**.RevocationAuthorityService.maxRevocationInterval = 85s
**.RevocationAuthorityService.dropProbability = 0.4
**.RevocationAuthorityService.delayProbability = 0.4
**.RevocationAuthorityService.delayMean = 2.0s
**.RevocationAuthorityService.delayStdDev = 0.5s

# Vehicle Configuration
*.node[*].typename = "Car"
*.node[*].mobility.z = 0
*.node[*].middleware.updateInterval = 1s
*.node[*].middleware.datetime = "2013-06-01 12:35:00"
*.node[*].middleware.services = xmldoc("services-vehicles.xml")
*.vehicle[*].mobility.z = 0
*.vehicle[0].mobility.initialX = 10m
*.vehicle[0].mobility.initialY = 10m

*.revocationAuthority.*.service.*.enabled = true
*.revocationAuthority.*.service.*.level = info

*.sumoGUI = true

# A1 (selective forwarding / gray-hole) attacker-population-share sweep.
# **.MaliciousCRLVehicleService.attackerShare defaults to 0 (MaliciousCRLVehicleService.ned),
# so [General] alone (i.e. none of these configs selected) already reproduces the honest
# baseline; these configs exist only to name the swept values explicitly.
[Config AttackerShare0]
**.MaliciousCRLVehicleService.attackerShare = 0

[Config AttackerShare10]
**.MaliciousCRLVehicleService.attackerShare = 0.10

[Config AttackerShare25]
**.MaliciousCRLVehicleService.attackerShare = 0.25

[Config AttackerShare50]
**.MaliciousCRLVehicleService.attackerShare = 0.50

# Mobile jamming bubble (Phase 4 config surface -- example only, not yet tuned to real
# experiment values). **.jammingEnabled defaults to false (VehicleCRLService.ned /
# MaliciousCRLVehicleService.ned inherits it), so [General] alone reproduces the honest
# baseline unaffected. To designate which vehicle(s) carry the jamming capability, route
# their node index(es) to services-jammer-active.xml instead of services-vehicles.xml (same
# node-index pattern as A1's attacker designation) -- e.g. node[0] below.
[Config JammerActive]
*.node[0].middleware.services = xmldoc("services-jammer-active.xml")
**.jammingEnabled = true
**.jammingRadius = 100m
**.jammingTimingMode = "alwaysOn"

# Added during pre-flight edge-case verification (2026-07-22 session): boundedWindow with a
# window placed strictly after the jammer vehicle's observed t=265s departure, to confirm
# "no overlap" produces zero effect cleanly rather than an error. Kept here since it's a
# reusable regression check, not just a throwaway.
[Config JammerActiveNonOverlapWindow]
*.node[0].middleware.services = xmldoc("services-jammer-active.xml")
**.jammingEnabled = true
**.jammingRadius = 100m
**.jammingTimingMode = "boundedWindow"
**.jammingT1 = 280s
**.jammingT2 = 290s

# Pilot batch (2026-07-30): 3 fixed radii, alwaysOn, one replication each. Small radius
# sits below typical same-direction spacing (~250m computed from steady-state occupancy),
# mid radius approximates it, large radius exceeds it -- see pre-flight report Part 2b.
#
# MULTI-JAMMER FIX (2026-07-30): a single alwaysOn jammer only covers its own transit
# through the closed loop (~264-450s observed/estimated), i.e. a small fraction of a 3600s
# run -- everything after it departs sees zero jamming. Fixed by designating every 16th
# spawned vehicle (by node index, which is assigned in strict spawn order -- see
# BasicNodeManager::createModule()'s monotonic m_nodeIndex counter, never reused/reset) as
# an additional jammer. K=16 x ~9s mean inter-arrival (400 veh/hr combined across both
# flows) = ~144s average spacing between consecutive jammer spawns, a ~2.1x safety margin
# against the shortest observed/estimated individual jammer transit time (~264-300s) --
# see pilot-batch report for the full derivation. Indices run 0..480 (31 jammers) to cover
# the full ~400-vehicle nominal population for a 3600s run with headroom against run-to-run
# count variance; unused high indices are harmless no-ops if fewer vehicles ever spawn.
# This is a receiver-side-transparent change: checkJammingBubble() already loops over
# every currently-registered jammer (JammerRegistry::getJammerIds()), so no C++ changes
# were needed -- purely additional node-index routing, same mechanism as the single-jammer
# case, just repeated.
[Config JammerActiveMultiBase]
# K=15 (odd), NOT 16: with K=16 (even), the two synchronized-period flows' node
# indices alias almost entirely onto one flow (empirically 84.6% f_0 / 15.4% f_1 over
# a 1800s sample) because both flows inject at the same 18s period from t=0, so
# global spawn order is a near-regular period-2 alternation -- an EVEN step lands on
# the same flow's slot every time. An ODD step breaks this aliasing (confirmed:
# 42.9% f_0 / 57.1% f_1 with K=15, close to even). See pilot-batch risk-check report.
*.node[0].middleware.services = xmldoc("services-jammer-active.xml")
*.node[15].middleware.services = xmldoc("services-jammer-active.xml")
*.node[30].middleware.services = xmldoc("services-jammer-active.xml")
*.node[45].middleware.services = xmldoc("services-jammer-active.xml")
*.node[60].middleware.services = xmldoc("services-jammer-active.xml")
*.node[75].middleware.services = xmldoc("services-jammer-active.xml")
*.node[90].middleware.services = xmldoc("services-jammer-active.xml")
*.node[105].middleware.services = xmldoc("services-jammer-active.xml")
*.node[120].middleware.services = xmldoc("services-jammer-active.xml")
*.node[135].middleware.services = xmldoc("services-jammer-active.xml")
*.node[150].middleware.services = xmldoc("services-jammer-active.xml")
*.node[165].middleware.services = xmldoc("services-jammer-active.xml")
*.node[180].middleware.services = xmldoc("services-jammer-active.xml")
*.node[195].middleware.services = xmldoc("services-jammer-active.xml")
*.node[210].middleware.services = xmldoc("services-jammer-active.xml")
*.node[225].middleware.services = xmldoc("services-jammer-active.xml")
*.node[240].middleware.services = xmldoc("services-jammer-active.xml")
*.node[255].middleware.services = xmldoc("services-jammer-active.xml")
*.node[270].middleware.services = xmldoc("services-jammer-active.xml")
*.node[285].middleware.services = xmldoc("services-jammer-active.xml")
*.node[300].middleware.services = xmldoc("services-jammer-active.xml")
*.node[315].middleware.services = xmldoc("services-jammer-active.xml")
*.node[330].middleware.services = xmldoc("services-jammer-active.xml")
*.node[345].middleware.services = xmldoc("services-jammer-active.xml")
*.node[360].middleware.services = xmldoc("services-jammer-active.xml")
*.node[375].middleware.services = xmldoc("services-jammer-active.xml")
*.node[390].middleware.services = xmldoc("services-jammer-active.xml")
*.node[405].middleware.services = xmldoc("services-jammer-active.xml")
*.node[420].middleware.services = xmldoc("services-jammer-active.xml")
*.node[435].middleware.services = xmldoc("services-jammer-active.xml")
*.node[450].middleware.services = xmldoc("services-jammer-active.xml")
*.node[465].middleware.services = xmldoc("services-jammer-active.xml")
*.node[480].middleware.services = xmldoc("services-jammer-active.xml")
*.node[495].middleware.services = xmldoc("services-jammer-active.xml")
**.jammingEnabled = true
**.jammingTimingMode = "alwaysOn"

[Config JammerActivePilotA]
extends = JammerActiveMultiBase
**.jammingRadius = 25m

# B'/C' recalibration (2026-08-01): original 140m/300m produced 42.7%/90.9% event-level
# V2V censoring, not a graduated spread -- B was already near-severe, C left too thin a
# sample for Metric D (n=14 active/n=2 self). Logistic fit to the 3 known points
# (25m->3.5%, 140m->42.7%, 300m->90.9%, fit essentially exact) plus two rounds of cheap
# 1200s validation across all three schemes converged on B'=100m and C'=200m:
#   100m: active=19.3% self=14.5% passive=18.0%  (target 15-25%, all in/near range)
#   200m: active=64.9% self=51.0% passive=54.8%  (target 50-65%, all in range -- 175m
#         undershot for self/passive at 41.5%/47.6%, active's own fit didn't transfer)
# Projected usable-n at full 3600s (scaled from 1200s validation, active/self): B'~96/66,
# C'~57/27 -- both comfortably clear of the old C's n=14/n=2 collapse.
[Config JammerActivePilotB]
extends = JammerActiveMultiBase
**.jammingRadius = 100m

[Config JammerActivePilotC]
extends = JammerActiveMultiBase
**.jammingRadius = 200m
