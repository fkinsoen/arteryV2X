[General]
network = artery.inet.World

sim-time-limit = 3600s
debug-on-errors = true
print-undisposed = true

cmdenv-express-mode = true
cmdenv-autoflush = true

**.scalar-recording = false
**.vector-recording = false

*.traci.core.version = -1
*.traci.launcher.typename = "PosixLauncher"
*.traci.launcher.sumocfg = "active_rev.sumocfg"
*.traci.launcher.sumo = "sumo-gui"

# separate random number generator for MaliciousCRLVehicleService's attacker-selection draw
# (A1), isolated from stream 0 so the attackerShare=0 regression check reproduces the
# existing baseline's stream-0 draw sequence unperturbed
num-rngs = 2
**.MaliciousCRLVehicleService.rng-0 = 1

# RSU Configuration
*.numRoadSideUnits = 1

*.rsu[*].typename = "RSU"
*.rsu[*].wlan[*].typename = "VanetNic"
*.rsu[*].wlan[*].radio.channelNumber = 180
*.rsu[*].wlan[*].radio.carrierFrequency = 5.9 GHz
*.rsu[*].wlan[*].radio.transmitter.power = 200 mW

*.rsu[*].middleware.datetime = "2013-06-01 12:35:00"
*.rsu[*].middleware.services = xmldoc("services-rsu.xml")

*.rsu[0].**.protectedCommunicationZones = xml("<zones><zone latitude=\"49.576070\" longitude=\"11.015889\" /></zones>")

*.rsu[0].mobility.initialZ = 20m
*.rsu[0].mobility.initialX = 50m
*.rsu[0].mobility.initialY = 50m

**.RevocationAuthorityService.revocationMode = "interval"
**.RevocationAuthorityService.crlGenInterval = 6s
**.RevocationAuthorityService.minRevocationInterval = 45s
**.RevocationAuthorityService.maxRevocationInterval = 85s
**.RevocationAuthorityService.dropProbability = 0.4
**.RevocationAuthorityService.delayProbability = 0.4
**.RevocationAuthorityService.delayMean = 2.0s
**.RevocationAuthorityService.delayStdDev = 0.5s

# Vehicle Configuration
*.node[*].typename = "Car"
*.node[*].mobility.z = 0
*.node[*].middleware.updateInterval = 1s
*.node[*].middleware.datetime = "2013-06-01 12:35:00"
*.node[*].middleware.services = xmldoc("services-vehicles.xml")
*.vehicle[*].mobility.z = 0
*.vehicle[0].mobility.initialX = 10m
*.vehicle[0].mobility.initialY = 10m

*.revocationAuthority.*.service.*.enabled = true
*.revocationAuthority.*.service.*.level = info

*.sumoGUI = true

# A1 (selective forwarding / gray-hole) attacker-population-share sweep.
# **.MaliciousCRLVehicleService.attackerShare defaults to 0 (MaliciousCRLVehicleService.ned),
# so [General] alone (i.e. none of these configs selected) already reproduces the honest
# baseline; these configs exist only to name the swept values explicitly.
[Config AttackerShare0]
**.MaliciousCRLVehicleService.attackerShare = 0

[Config AttackerShare10]
**.MaliciousCRLVehicleService.attackerShare = 0.10

[Config AttackerShare25]
**.MaliciousCRLVehicleService.attackerShare = 0.25

[Config AttackerShare50]
**.MaliciousCRLVehicleService.attackerShare = 0.50
