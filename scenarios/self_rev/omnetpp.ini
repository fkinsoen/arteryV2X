[General]
# Switched from artery.inet.World -- adds environmentModel (GlobalEnvironmentModel) +
# idRegistry + jammerRegistry, needed by the mobile-jamming-bubble attack's position lookup.
# Confirmed behavior-neutral for the existing Chapter 4 baseline via Phase 0B's paired
# base/envmod comparison runs (deterministic streams identical; system-time-reseeded
# revocation-timing streams show run-to-run variance consistent with pre-existing same-
# network noise, no directional shift observed) -- re-run that comparison if this file's
# module topology changes again.
network = artery.envmod.World

sim-time-limit = 3600s
debug-on-errors = true
print-undisposed = true

cmdenv-express-mode = true
cmdenv-autoflush = true

**.scalar-recording = true
**.vector-recording = true

*.traci.core.version = -1
*.traci.launcher.typename = "PosixLauncher"
*.traci.launcher.sumocfg = "self_rev.sumocfg"
*.traci.launcher.sumo = "sumo-gui"

# separate random number generator for MaliciousHBVehicleService's attacker-selection draw
# (A1), isolated from stream 0 so the attackerShare=0 regression check reproduces the
# existing baseline's stream-0 draw sequence unperturbed
num-rngs = 2
**.MaliciousHBVehicleService.rng-0 = 1

# RSU Configuration
*.numRoadSideUnits = 1

*.rsu[*].typename = "RSU"
*.rsu[*].wlan[*].typename = "VanetNic"
*.rsu[*].wlan[*].radio.channelNumber = 180
*.rsu[*].wlan[*].radio.carrierFrequency = 5.9 GHz
*.rsu[*].wlan[*].radio.transmitter.power = 200 mW

*.rsu[*].middleware.datetime = "2013-06-01 12:35:00"
*.rsu[*].middleware.services = xmldoc("services-rsu.xml")

#*.rsu[0].**.protectedCommunicationZones = xml("<zones><zone latitude=\"49.576070\" longitude=\"11.015889\" /></zones>")

*.rsu[*].mobility.initialZ = 10m
*.rsu[0].mobility.initialX = 10m
*.rsu[0].mobility.initialY = 10m

**.SelfRevocationAuthService.revocationMode = "interval"
**.SelfRevocationAuthService.validityWindow = 30s
**.VehicleHBService.validityWindow = 30s
**.SelfRevocationAuthService.heartbeatInterval = 6s
**.SelfRevocationAuthService.minRevocationInterval = 45s
**.SelfRevocationAuthService.maxRevocationInterval = 85s
**.SelfRevocationAuthService.dropProbability = 0.4
**.SelfRevocationAuthService.delayProbability = 0.4
**.SelfRevocationAuthService.delayMean = 2.0s
**.SelfRevocationAuthService.delayStdDev = 0.5s

# Vehicle Configuration
*.node[*].typename = "Car"
*.node[*].mobility.z = 0
*.node[*].middleware.updateInterval = 1s
*.node[*].middleware.datetime = "2013-06-01 12:35:00"
*.node[*].middleware.services = xmldoc("services-vehicles.xml")
*.vehicle[*].mobility.z = 0
*.vehicle[0].mobility.initialX = 10m
*.vehicle[0].mobility.initialY = 10m
*.node[*].wlan[*].radio.receiver.packetFilter = "uniform(0,1) < 0.7"

*.revocationAuthority.*.service.*.enabled = true
*.revocationAuthority.*.service.*.level = info

*.sumoGUI = true

# A1 (selective forwarding / gray-hole) attacker-population-share sweep.
# **.MaliciousHBVehicleService.attackerShare defaults to 0 (MaliciousHBVehicleService.ned),
# so [General] alone (i.e. none of these configs selected) already reproduces the honest
# baseline; these configs exist only to name the swept values explicitly.
[Config AttackerShare0]
**.MaliciousHBVehicleService.attackerShare = 0

[Config AttackerShare10]
**.MaliciousHBVehicleService.attackerShare = 0.10

[Config AttackerShare25]
**.MaliciousHBVehicleService.attackerShare = 0.25

[Config AttackerShare50]
**.MaliciousHBVehicleService.attackerShare = 0.50

# Mobile jamming bubble (Phase 4 config surface -- example only, not yet tuned to real
# experiment values). **.jammingEnabled defaults to false (VehicleHBService.ned /
# MaliciousHBVehicleService.ned inherits it), so [General] alone reproduces the honest
# baseline unaffected. To designate which vehicle(s) carry the jamming capability, route
# their node index(es) to services-jammer-self.xml instead of services-vehicles.xml (same
# node-index pattern as A1's attacker designation) -- e.g. node[0] below.
[Config JammerSelf]
*.node[0].middleware.services = xmldoc("services-jammer-self.xml")
**.jammingEnabled = true
**.jammingRadius = 100m
**.jammingTimingMode = "alwaysOn"

# Pilot batch (2026-07-30): 3 fixed radii, alwaysOn, one replication each. Small radius
# sits below typical same-direction spacing (~250m computed from steady-state occupancy),
# mid radius approximates it, large radius exceeds it -- see pre-flight report Part 2b.
#
# MULTI-JAMMER FIX (2026-07-30): see active_rev/omnetpp.ini's JammerActiveMultiBase comment
# for the full derivation -- same K=16 node-index spacing (~144s avg jammer-spawn gap,
# ~2.1x margin against the ~264-300s shortest individual transit), same receiver-side-
# transparent mechanism (JammerRegistry::getJammerIds() loop already handles N jammers).
[Config JammerSelfMultiBase]
# K=15 (odd), NOT 16 -- see JammerActiveMultiBase's comment in active_rev/omnetpp.ini
# for the full derivation (even K aliases onto one flow's synchronized injection
# period; confirmed empirically 84.6/15.4 at K=16 vs 42.9/57.1 at K=15).
*.node[0].middleware.services = xmldoc("services-jammer-self.xml")
*.node[15].middleware.services = xmldoc("services-jammer-self.xml")
*.node[30].middleware.services = xmldoc("services-jammer-self.xml")
*.node[45].middleware.services = xmldoc("services-jammer-self.xml")
*.node[60].middleware.services = xmldoc("services-jammer-self.xml")
*.node[75].middleware.services = xmldoc("services-jammer-self.xml")
*.node[90].middleware.services = xmldoc("services-jammer-self.xml")
*.node[105].middleware.services = xmldoc("services-jammer-self.xml")
*.node[120].middleware.services = xmldoc("services-jammer-self.xml")
*.node[135].middleware.services = xmldoc("services-jammer-self.xml")
*.node[150].middleware.services = xmldoc("services-jammer-self.xml")
*.node[165].middleware.services = xmldoc("services-jammer-self.xml")
*.node[180].middleware.services = xmldoc("services-jammer-self.xml")
*.node[195].middleware.services = xmldoc("services-jammer-self.xml")
*.node[210].middleware.services = xmldoc("services-jammer-self.xml")
*.node[225].middleware.services = xmldoc("services-jammer-self.xml")
*.node[240].middleware.services = xmldoc("services-jammer-self.xml")
*.node[255].middleware.services = xmldoc("services-jammer-self.xml")
*.node[270].middleware.services = xmldoc("services-jammer-self.xml")
*.node[285].middleware.services = xmldoc("services-jammer-self.xml")
*.node[300].middleware.services = xmldoc("services-jammer-self.xml")
*.node[315].middleware.services = xmldoc("services-jammer-self.xml")
*.node[330].middleware.services = xmldoc("services-jammer-self.xml")
*.node[345].middleware.services = xmldoc("services-jammer-self.xml")
*.node[360].middleware.services = xmldoc("services-jammer-self.xml")
*.node[375].middleware.services = xmldoc("services-jammer-self.xml")
*.node[390].middleware.services = xmldoc("services-jammer-self.xml")
*.node[405].middleware.services = xmldoc("services-jammer-self.xml")
*.node[420].middleware.services = xmldoc("services-jammer-self.xml")
*.node[435].middleware.services = xmldoc("services-jammer-self.xml")
*.node[450].middleware.services = xmldoc("services-jammer-self.xml")
