[Config JammerSelfPilotA]
extends = JammerSelfMultiBase
**.jammingRadius = 25m

# B'/C' recalibration (2026-08-01) -- see active_rev/omnetpp.ini's JammerActivePilotB/C
# comment for the full derivation and validated fractions per scheme.
[Config JammerSelfPilotB]
extends = JammerSelfMultiBase
**.jammingRadius = 100m

[Config JammerSelfPilotC]
extends = JammerSelfMultiBase
**.jammingRadius = 200m
