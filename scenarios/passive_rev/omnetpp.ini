[General]
# Switched from artery.inet.World -- adds environmentModel (GlobalEnvironmentModel) +
# idRegistry + jammerRegistry, needed by the mobile-jamming-bubble attack's position lookup.
# Confirmed behavior-neutral for the existing Chapter 4 baseline via Phase 0B's paired
# base/envmod comparison runs (deterministic streams identical; RA-side REVOKE/DENIAL timing
# bit-identical across the pair; only reception-layer RECV events diverged, unrelated to this
# scheme's own effective-revocation-time metric) -- re-run that comparison if this file's
# module topology changes again.
network = artery.envmod.World

sim-time-limit = 3600s
debug-on-errors = true
print-undisposed = true

cmdenv-express-mode = true
cmdenv-autoflush = true

**.scalar-recording = false
**.vector-recording = false

*.traci.core.version = -1
*.traci.launcher.typename = "PosixLauncher"
*.traci.launcher.sumocfg = "passive_rev.sumocfg"
*.traci.launcher.sumo = "sumo-gui"

# RSU Configuration
*.numRoadSideUnits = 1

*.rsu[*].typename = "RSU"
*.rsu[*].wlan[*].typename = "VanetNic"
*.rsu[*].wlan[*].radio.channelNumber = 180
*.rsu[*].wlan[*].radio.carrierFrequency = 5.9 GHz
*.rsu[*].wlan[*].radio.transmitter.power = 200 mW

*.rsu[*].middleware.datetime = "2013-06-01 12:35:00"
*.rsu[*].middleware.services = xmldoc("services-rsu.xml")

#*.rsu[0].**.protectedCommunicationZones = xml("<zones><zone latitude=\"49.576070\" longitude=\"11.015889\" /></zones>")

*.rsu[0].mobility.initialZ = 20m
*.rsu[0].mobility.initialX = 50m
*.rsu[0].mobility.initialY = 50m

**.PseudoAuthService.revocationMode = "interval"
**.PseudoAuthService.pseudonymLifetime = 60s
# **.PseudoAuthService.revocationInterval = 10s
**.PseudoAuthService.minRevocationInterval = 45s
**.PseudoAuthService.maxRevocationInterval = 85s
**.PseudoAuthService.dropProbability = 0.4
**.PseudoAuthService.delayProbability = 0.4
**.PseudoAuthService.delayMean = 2.0s
**.PseudoAuthService.delayStdDev = 0.5s

# Vehicle Configuration
*.node[*].typename = "Car"
*.node[*].mobility.z = 0
*.node[*].middleware.updateInterval = 2s
*.node[*].middleware.datetime = "2013-06-01 12:35:00"
*.node[*].middleware.services = xmldoc("services-vehicles.xml")
*.vehicle[*].mobility.z = 0
*.vehicle[0].mobility.initialX = 10m
*.vehicle[0].mobility.initialY = 10m

*.node[*].wlan[*].typename = "VanetNic"
*.node[*].wlan[*].radio.channelNumber = 180
*.node[*].wlan[*].radio.carrierFrequency = 5.9 GHz
*.node[*].wlan[*].radio.transmitter.power = 200 mW

*.sumoGUI = true

# Mobile jamming bubble (Phase 4 config surface -- example only, not yet tuned to real
# experiment values). **.jammingEnabled defaults to false (VehiclePassiveService.ned), so
# [General] alone reproduces the honest baseline unaffected. To designate which vehicle(s)
# carry the jamming capability, route their node index(es) to services-jammer-passive.xml
# instead of services-vehicles.xml (same node-index pattern as A1's attacker designation in
# the active/self scenarios) -- e.g. node[0] below. NOTE: for passive specifically, jamming
# the PseudonymMessage delays the RECEIVING vehicle's own re-authorization -- it does not
# suppress a third vehicle's revocation news the way active/self's jamming does, and does
# not move passive's own REVOKE/DENIAL-based effective-revocation-time metric at all. See
# VehiclePassiveService::checkJammingBubble()'s comment for the same caveat in code.
[Config JammerPassive]
*.node[0].middleware.services = xmldoc("services-jammer-passive.xml")
**.jammingEnabled = true
**.jammingRadius = 100m
**.jammingTimingMode = "alwaysOn"

# Pilot batch (2026-07-30): 3 fixed radii, alwaysOn, one replication each. Small radius
# sits below typical same-direction spacing (~250m computed from steady-state occupancy),
# mid radius approximates it, large radius exceeds it -- see pre-flight report Part 2b.
#
# MULTI-JAMMER FIX (2026-07-30): see active_rev/omnetpp.ini's JammerActiveMultiBase comment
# for the full derivation -- same K=16 node-index spacing (~144s avg jammer-spawn gap,
# ~2.1x margin against the ~264-300s shortest individual transit), same receiver-side-
# transparent mechanism (JammerRegistry::getJammerIds() loop already handles N jammers).
[Config JammerPassiveMultiBase]
# K=15 (odd), NOT 16 -- see JammerActiveMultiBase's comment in active_rev/omnetpp.ini
# for the full derivation (even K aliases onto one flow's synchronized injection
# period; confirmed empirically 84.6/15.4 at K=16 vs 42.9/57.1 at K=15).
*.node[0].middleware.services = xmldoc("services-jammer-passive.xml")
*.node[15].middleware.services = xmldoc("services-jammer-passive.xml")
*.node[30].middleware.services = xmldoc("services-jammer-passive.xml")
*.node[45].middleware.services = xmldoc("services-jammer-passive.xml")
*.node[60].middleware.services = xmldoc("services-jammer-passive.xml")
*.node[75].middleware.services = xmldoc("services-jammer-passive.xml")
*.node[90].middleware.services = xmldoc("services-jammer-passive.xml")
*.node[105].middleware.services = xmldoc("services-jammer-passive.xml")
*.node[120].middleware.services = xmldoc("services-jammer-passive.xml")
*.node[135].middleware.services = xmldoc("services-jammer-passive.xml")
*.node[150].middleware.services = xmldoc("services-jammer-passive.xml")
*.node[165].middleware.services = xmldoc("services-jammer-passive.xml")
*.node[180].middleware.services = xmldoc("services-jammer-passive.xml")
*.node[195].middleware.services = xmldoc("services-jammer-passive.xml")
